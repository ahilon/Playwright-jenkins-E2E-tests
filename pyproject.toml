[project]
name = "playwright-jenkins-e2e"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pawel", email = "ziela111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[project.scripts]
playwright-jenkins-e2e = "playwright_jenkins_e2e:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: fast page login page",
    "e2e: Full scenarios tests",
    "rest: Jenkins REST API tests"
]
