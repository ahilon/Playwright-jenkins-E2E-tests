name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .