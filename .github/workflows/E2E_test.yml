name: Jenkins E2E tests

on:
    push:
    workflow_dispatch:

jobs:
    e2e-tests:
        runs-on: ubuntu-latest

        steps:
            - name: checkout repository
              uses: actions/checkout@v4
            
            - name: set up uv
              uses: astral-sh/setup-uv@v6
            
            - name: Install dependencies
              run: uv sync