name: Jenkins E2E tests

on:
    pull_request:
        types: [labeled]
    workflow_dispatch:

permissions:
    contents: read

jobs:
    e2e-tests:
        if: github.event.label.name == 'e2e_tests'
        runs-on: ubuntu-latest
        timeout-minutes: 15

        environment: e2e-tests

        env:
            JENKINS_URL: http://localhost:8080
            JENKINS_USER: ${{ secrets.JENKINS_USER }}
            JENKINS_PASSWORD: ${{ secrets.JENKINS_PASSWORD }}

        steps:
            - name: checkout repository
              uses: actions/checkout@v5
            
            - name: set up uv
              uses: astral-sh/setup-uv@v7
            
            - name: Install dependencies
              run: uv sync --locked

            - name: Install Chromium and system dependencies
              run: uv run playwright install --with-deps chromium

            - name: Start Jenkins and wait for readiness
              run: docker compose -f docker/docker-compose.yaml up -d --wait --wait-timeout 240

            - name: Run E2E tests
              run: uv run pytest tests/e2e --tracing retain-on-failure

            - name: Show Jenkins logs on failure
              if: failure()
              run: docker compose -f docker/docker-compose.yaml logs --no-color

            - name: Stop Jenkins
              if: always()
              run: docker compose -f docker/docker-compose.yaml down